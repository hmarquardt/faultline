[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "faultline-workbench"
version = "0.1.0"
description = "Local-first, evidence-first adversarial LLM evaluation workbench"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pydantic>=2.10,<3",
  "textual>=3,<7",
  "rich>=13.9,<16",
  "httpx>=0.28,<1",
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5",
  "referencing>=0.36,<1",
  "platformdirs>=4,<5",
]

[project.scripts]
faultline = "faultline.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/faultline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
